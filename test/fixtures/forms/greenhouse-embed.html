<!doctype html>
<html lang="en"><body>
<!-- A company careers page with the Greenhouse form embedded on its own site. -->
<div id="grnhse_app">
<form>
  <label for="first_name">First Name</label><input id="first_name" name="job_application[first_name]">
  <label for="last_name">Last Name</label><input id="last_name" name="job_application[last_name]">
  <label for="email">Email</label><input id="email" name="job_application[email]" type="email">
  <h3>Education</h3>
  <label id="lbl-school">School</label><input id="school--0" role="combobox" aria-labelledby="lbl-school" aria-controls="school-list"><div role="listbox" id="school-list"></div>
  <label id="lbl-degree">Degree</label><input id="degree--0" role="combobox" aria-labelledby="lbl-degree" aria-controls="degree-list"><div role="listbox" id="degree-list"></div>
  <label id="lbl-disc">Discipline</label><input id="discipline--0" role="combobox" aria-labelledby="lbl-disc" aria-controls="disc-list"><div role="listbox" id="disc-list"></div>
  <label for="end-year--0">End date year</label><input id="end-year--0" name="end-year--0">
</form>
</div>
</body></html>
