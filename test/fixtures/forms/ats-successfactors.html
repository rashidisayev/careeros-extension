<!doctype html>
<html lang="en"><body>
<!-- SAP SuccessFactors candidate profile (career*.successfactors.com/.eu): fbclc_ ids; simplified. -->
<form>
  <label for="fbclc_fName">First Name</label><input id="fbclc_fName" name="fbclc_fName" required>
  <label for="fbclc_lName">Last Name</label><input id="fbclc_lName" name="fbclc_lName" required>
  <label for="fbclc_email">Email</label><input id="fbclc_email" name="fbclc_email" type="email" required>
  <label for="fbclc_cellPhone">Cell Phone</label><input id="fbclc_cellPhone" name="fbclc_cellPhone">
  <label for="fbclc_city">City</label><input id="fbclc_city" name="fbclc_city">
  <label for="fbclc_zip">Zip/Postal Code</label><input id="fbclc_zip" name="fbclc_zip">
  <label for="fbclc_country">Country</label>
  <select id="fbclc_country" name="fbclc_country"><option value="">No Selection</option><option value="AT">Austria</option><option value="DE">Germany</option><option value="CH">Switzerland</option></select>
</form>
</body></html>
