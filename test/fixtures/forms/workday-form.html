<!doctype html>
<html lang="en">
<body>
<div data-automation-id="applyFlowPage">
  <h2 data-automation-id="pageHeader">My Information</h2>
  <div data-automation-id="formField-legalNameSection_firstName"><label id="lbl-fn">Given Name(s)<abbr title="required">*</abbr></label><input type="text" data-automation-id="legalNameSection_firstName" aria-labelledby="lbl-fn" aria-required="true"></div>
  <div data-automation-id="formField-legalNameSection_lastName"><label id="lbl-ln">Family Name<abbr title="required">*</abbr></label><input type="text" data-automation-id="legalNameSection_lastName" aria-labelledby="lbl-ln" aria-required="true"></div>
  <div data-automation-id="formField-addressSection_addressLine1"><label id="lbl-a1">Address Line 1</label><input type="text" data-automation-id="addressSection_addressLine1" aria-labelledby="lbl-a1"></div>
  <div data-automation-id="formField-addressSection_city"><label id="lbl-c">City</label><input type="text" data-automation-id="addressSection_city" aria-labelledby="lbl-c"></div>
  <div data-automation-id="formField-addressSection_postalCode"><label id="lbl-pc">Postal Code</label><input type="text" data-automation-id="addressSection_postalCode" aria-labelledby="lbl-pc"></div>
  <div data-automation-id="formField-email"><label id="lbl-em">Email Address</label><input type="text" data-automation-id="email" aria-labelledby="lbl-em"></div>
  <div data-automation-id="formField-countryPhoneCode"><label id="lbl-cc">Country Phone Code</label>
    <select data-automation-id="countryPhoneCode" aria-labelledby="lbl-cc"><option value="">Select One</option><option value="US">United States of America (+1)</option><option value="CA">Canada (+1)</option><option value="DE">Germany (+49)</option><option value="GB">United Kingdom (+44)</option></select></div>
  <div data-automation-id="formField-phoneNumber"><label id="lbl-ph">Phone Number</label><input type="text" data-automation-id="phone-number" aria-labelledby="lbl-ph"></div>
  <div data-automation-id="formField-source"><label id="lbl-src">How Did You Hear About Us?</label><div role="combobox" aria-labelledby="lbl-src" tabindex="0">Select One</div></div>
</div>
</body>
</html>
