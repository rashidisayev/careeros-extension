<!doctype html>
<html lang="de"><body>
<!-- Personio Bewerbungsformular (*.jobs.personio.de): Feldnamen wie im öffentlichen Formular; vereinfacht. -->
<form>
  <label for="first_name">Vorname</label><input id="first_name" name="first_name" required>
  <label for="last_name">Nachname</label><input id="last_name" name="last_name" required>
  <label for="email">E-Mail</label><input id="email" name="email" type="email" required>
  <label for="phone">Telefon</label><input id="phone" name="phone">
  <label for="available_from">Verfügbar ab</label><input id="available_from" name="available_from" type="date">
  <label for="salary_expectations">Gehaltsvorstellung</label><input id="salary_expectations" name="salary_expectations">
  <label for="birthday">Geburtsdatum</label><input id="birthday" name="birthday" type="date">
  <label for="cv">Lebenslauf</label><input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx">
</form>
</body></html>
