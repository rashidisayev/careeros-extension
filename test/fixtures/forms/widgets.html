<!doctype html>
<html lang="en">
<body>
<!-- List widgets as ATS forms build them: a button that opens a list, and a typing combobox. -->
<form>
  <label for="fn">First name</label><input id="fn" name="first_name">
  <label for="ln">Last name</label><input id="ln" name="last_name">
  <label for="em">Email</label><input id="em" name="email" type="email">

  <label id="lbl-country">Country</label>
  <button type="button" id="country" aria-haspopup="listbox" aria-labelledby="lbl-country" aria-controls="country-list">Select...</button>
  <div role="listbox" id="country-list" hidden>
    <div role="option">Austria</div><div role="option">Germany</div><div role="option">Switzerland</div>
  </div>

  <label for="city">City</label>
  <input id="city" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="city-list">
  <ul role="listbox" id="city-list"></ul>

  <label for="langs">Languages</label><select id="langs" name="langs" multiple><option>English</option><option>German</option><option>French</option></select>
  <fieldset><legend>Work arrangement</legend>
    <label><input type="checkbox" name="arr" value="remote"> Remote</label>
    <label><input type="checkbox" name="arr" value="hybrid"> Hybrid</label>
  </fieldset>
  <label for="cv">Resume</label><input id="cv" name="resume" type="file" accept=".pdf">
</form>
<script>
{
  const btn = document.getElementById("country");
  const list = document.getElementById("country-list");
  btn.addEventListener("mousedown", () => { list.hidden = false; });
  list.addEventListener("click", (e) => {
    const o = e.target.closest("[role=option]");
    if (!o) return;
    btn.textContent = o.textContent;
    list.hidden = true;
  });
  // The city list is filled from what is typed, a moment later (like a server search).
  const CITIES = ["Berlin", "Bern", "Bergen", "Munich"];
  const city = document.getElementById("city");
  const cl = document.getElementById("city-list");
  city.addEventListener("input", () => {
    const q = city.value.toLowerCase();
    setTimeout(() => {
      cl.innerHTML = q ? CITIES.filter((c) => c.toLowerCase().startsWith(q)).map((c) => `<li role="option">${c}</li>`).join("") : "";
    }, 60);
  });
  cl.addEventListener("click", (e) => {
    const o = e.target.closest("[role=option]");
    if (!o) return;
    city.value = o.textContent;
    cl.innerHTML = "";
  });
}
</script>
</body>
</html>
