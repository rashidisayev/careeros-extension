<!doctype html>
<html lang="en"><body>
<!-- Teamtailor application form (*.teamtailor.com): candidate[...] names; simplified. -->
<form>
  <label for="fn">First name</label><input id="fn" name="candidate[first_name]" required>
  <label for="ln">Last name</label><input id="ln" name="candidate[last_name]" required>
  <label for="em">Email</label><input id="em" name="candidate[email]" type="email" required>
  <label for="ph">Phone</label><input id="ph" name="candidate[phone]">
  <label for="li">LinkedIn profile</label><input id="li" name="candidate[linkedin_url]">
  <label for="cv">Resume</label><input id="cv" name="candidate[resume]" type="file">
</form>
</body></html>
