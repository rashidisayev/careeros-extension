<!doctype html>
<html lang="en"><body>
<!-- SmartRecruiters application form (jobs.smartrecruiters.com): ids per field; simplified. -->
<form>
  <label for="first-name-input">First name</label><input id="first-name-input" required>
  <label for="last-name-input">Last name</label><input id="last-name-input" required>
  <label for="email-input">Email</label><input id="email-input" type="email" required>
  <label for="confirm-email-input">Confirm your email</label><input id="confirm-email-input" type="email" required>
  <label for="phone-number-input">Phone number</label><input id="phone-number-input" type="tel">
  <label for="linkedin-input">LinkedIn</label><input id="linkedin-input">
</form>
</body></html>
