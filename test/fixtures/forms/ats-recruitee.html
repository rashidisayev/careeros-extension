<!doctype html>
<html lang="en"><body>
<!-- Recruitee application form (*.recruitee.com): candidate[...] names; simplified. -->
<form>
  <label for="cn">Full name</label><input id="cn" name="candidate[name]" required>
  <label for="ce">Email address</label><input id="ce" name="candidate[email]" type="email" required>
  <label for="cp">Phone number</label><input id="cp" name="candidate[phone]">
  <label for="cv">CV or resume</label><input id="cv" name="candidate[cv]" type="file" accept=".pdf,.doc,.docx,.odt,.rtf">
  <label for="cl">Cover letter</label><input id="cl" name="candidate[cover_letter_file]" type="file">
</form>
</body></html>
